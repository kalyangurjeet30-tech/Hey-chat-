name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_OUTPUT"

          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([^".]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: The file $EXPECTED_APK is empty."
            exit 1
          fi

          echo "Found valid debug APK at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking gh CLI version..."
          gh --version

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          echo "Creating release with tag: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$(cat << 'EOF'
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** #${{ github.run_number }}
          - **Build Attempt:** #${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`

          ---
          > ⚠️ **Note:** This APK is intended for testing and development purposes. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Publication Succeeded ==="
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"

            echo "### 🚀 GitHub Release Created Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- You can download the APK directly from the **Assets** section on the release page." >> "$GITHUB_STEP_SUMMARY"
            echo "- The build artifact \`app-debug-apk\` is also preserved in this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publication did not succeed or was skipped."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."

            echo "### ⚠️ GitHub Release Notification" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Debug APK build and verification **succeeded**." >> "$GITHUB_STEP_SUMMARY"
            echo "- Artifact **\`app-debug-apk\`** is available for download under the workflow Summary artifacts section." >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub Release publishing was not completed." >> "$GITHUB_STEP_SUMMARY"
          fi
